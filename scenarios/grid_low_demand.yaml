id: grid_low_demand
description: 3x3 grid with light, constant demand, no incidents, and one emergency request on an uncongested route.
network:
  type: grid
  rows: 3
  cols: 3
  block_length_m: 200
  speed_limit_mps: 13.9
route_noise: 0.2
demand:
  - origins: boundary
    destinations: boundary
    vehicles_per_hour: 2
emergencies:
  - id: EMS_1
    origin: B_W_0
    destination: B_E_2
    release_s: 300
